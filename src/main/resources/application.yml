server:
  port: 8080

spring:
  application:
    name: filer-backend

  datasource:
    url: jdbc:mysql://localhost:3306/filer?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: filer123
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000ms
      lettuce:
        pool: { max-active: 8, max-idle: 8, min-idle: 0 }

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: filer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.filer.model
  configuration:
    map-underscore-to-camel-case: true

filer:
  upload-dir: /tmp/filer/uploads
  output-dir: /tmp/filer/outputs
  job-ttl-seconds: 86400
  max-file-size-mb: 500
  jwt:
    secret: ${JWT_SECRET:ZmlsZXItc2VjcmV0LWtleS1hdC1sZWFzdC0yNTYtYml0cy1sb25n}
    expiration-ms: 86400000   # 24 hours
  rate-limit:
    anonymous-per-hour: 100
    authenticated-per-hour: 1000
  share-link-ttl-hours: 24
  notify-email-enabled: ${EMAIL_ENABLED:false}

tesseract:
  data-path: /usr/share/tesseract-ocr/4.00/tessdata
  language: eng+chi_sim
